apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'

android {
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
        buildConfig true
    }


    defaultConfig {
        applicationId "com.saigopal.browser"
        minSdkVersion 22
        targetSdkVersion 35
        versionCode 30
        versionName "2.0.0"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        // P05 shell flip: false = Compose shell (BBTheme + AppNavHost); true = legacy layout path.
        buildConfigField "boolean", "LEGACY_SHELL", "false"
        // P08 ads: single legacy banner unit reused by both placements until console units exist;
        // ADS_ENABLED=false blanks every placement without touching other UI (rollback flag).
        buildConfigField "boolean", "ADS_ENABLED", "true"
        buildConfigField "String", "AD_UNIT_OVERVIEW", '"ca-app-pub-8397175258659671/5437849349"'
        buildConfigField "String", "AD_UNIT_SETTINGS", '"ca-app-pub-8397175258659671/5437849349"'
    }

    buildTypes {
        debug {
            // QA never serves or clicks real ads (AdMob policy hard guard).
            buildConfigField "boolean", "ADS_ENABLED", "true"
            buildConfigField "String", "AD_UNIT_OVERVIEW", '"ca-app-pub-3940256099942544/6300978111"'
            buildConfigField "String", "AD_UNIT_SETTINGS", '"ca-app-pub-3940256099942544/6300978111"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    namespace 'com.saigopal.browser'
    lint {
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }
    return void
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.firebase:firebase-analytics:22.1.2'
    implementation 'com.google.firebase:firebase-crashlytics:19.2.1'
    implementation 'com.google.firebase:firebase-perf:21.0.2'
    // firebase-storage removed in P11 (zero code references; feedback uses firebase-database).
    implementation 'com.google.firebase:firebase-database:21.0.0'
    testImplementation 'junit:junit:4.13.2'
    // P10: real org.json on the unit-test classpath (android.jar's stub throws "not mocked").
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'androidx.webkit:webkit:1.12.0' // P09: WebSettingsCompat.setAlgorithmicDarkeningAllowed needs ≥1.11

    //Google Ads
    implementation 'com.google.android.gms:play-services-ads:23.5.0'

    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

    // ---- UI rewrite (P00/P01/P02): Compose + Kotlin stack -----------------
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-text'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Favicon tiles on the new start page / tab cards (replaces Picasso in P07)
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // -----------------------------------------------------------------------

}
